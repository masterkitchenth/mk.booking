<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบจองคิว</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
  <style>
    :root{
      --black:#0d0d0d; --black-soft:#1a1a1a; --red:#c81e2c; --red-soft:#e8384a;
      --white:#ffffff; --gray:#9a9a9a; --border:rgba(255,255,255,0.08);
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      font-family:'Kanit', sans-serif; min-height:100vh;
      background:
        radial-gradient(circle at 15% 15%, rgba(200,30,44,0.35), transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(200,30,44,0.25), transparent 45%),
        linear-gradient(160deg, #050505 0%, #161616 45%, #0a0a0a 100%);
      color:var(--white); display:flex; justify-content:center; align-items:flex-start; padding:40px 16px;
    }
    .container{ width:100%; max-width:640px; position:relative; }
    .lang-switch{
      position:absolute; top:0; right:0; z-index:5;
      display:flex; gap:4px;
      background:rgba(255,255,255,0.06); border:1px solid var(--border);
      border-radius:999px; padding:4px;
    }
    .lang-switch .lang-opt{
      background:transparent; border:none; color:var(--gray);
      font-family:'Kanit', sans-serif; font-size:12px; font-weight:500;
      padding:6px 12px; border-radius:999px; cursor:pointer; letter-spacing:0.3px;
      transition:background .2s, color .2s;
    }
    .lang-switch .lang-opt:hover:not(.active){ background:rgba(200,30,44,0.15); color:var(--white); }
    .lang-switch .lang-opt.active{ background:linear-gradient(90deg, var(--red), var(--red-soft)); color:#fff; }
    .header{ text-align:center; margin-bottom:28px; padding-top:4px; }
    .header .badge{
      display:inline-block; padding:6px 18px; border-radius:999px;
      background:linear-gradient(90deg, var(--red), var(--red-soft));
      font-size:12px; letter-spacing:2px; font-weight:500; margin-bottom:14px;
    }
    .header h1{
      font-size:34px; font-weight:700;
      background:linear-gradient(90deg, #ffffff 0%, #ff8a93 45%, var(--red) 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent; letter-spacing:0.5px;
    }
    .header p{ color:var(--gray); font-size:14px; margin-top:8px; font-weight:300; }
    .card{
      background:linear-gradient(160deg, rgba(26,26,26,0.9), rgba(13,13,13,0.95));
      border:1px solid var(--border); border-radius:20px; padding:32px 28px;
      box-shadow:0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
      backdrop-filter:blur(10px);
    }
    .field{ margin-bottom:20px; }
    .field label{ display:block; font-size:13px; font-weight:500; color:var(--gray); margin-bottom:8px; letter-spacing:0.3px; }
    .field label .req{ color:var(--red-soft); margin-left:2px; }
    .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    input[type="text"], input[type="tel"], textarea, select{
      width:100%; background:#141414; border:1px solid var(--border); color:var(--white);
      font-family:'Kanit', sans-serif; font-size:15px; padding:12px 14px; border-radius:10px;
      outline:none; transition:border-color .2s, box-shadow .2s;
    }
    textarea{ resize:vertical; min-height:70px; }
    input:focus, textarea:focus, select:focus{ border-color:var(--red-soft); box-shadow:0 0 0 3px rgba(200,30,44,0.2); }
    select:disabled, input:disabled{ opacity:0.45; cursor:not-allowed; }
    select{
      -webkit-appearance:none; appearance:none;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239a9a9a' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat:no-repeat; background-position:right 14px center; padding-right:38px;
    }
    /* ===== Checkbox group สำหรับเลือกประเภทบริการ (เลือกได้หลายอัน) - แสดงเป็น grid 2 คอลัมน์ =====
       ใช้เทคนิค hanging indent: วงกลม (input) วางแบบ absolute ไว้มุมซ้ายบน ส่วนข้อความ (span) เป็น block ปกติ
       ที่มี padding-left คงที่เท่ากัน ทำให้ถ้าข้อความยาวจนต้องขึ้นบรรทัดใหม่ บรรทัดที่ 2 จะชิดขอบเดียวกับบรรทัดแรก
       (ไม่ไหลไปอยู่ใต้วงกลมเหมือนก่อนหน้านี้) ===== */
    .checkbox-group{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .checkbox-item{
      position:relative; display:block; background:#141414; border:1px solid var(--border);
      border-radius:10px; padding:14px 16px 14px 44px; cursor:pointer; transition:border-color .2s, background .2s;
    }
    .checkbox-item:hover{ border-color:var(--red-soft); background:rgba(200,30,44,0.06); }
    .checkbox-item input[type="checkbox"]{
      -webkit-appearance:none; appearance:none;
      width:20px; height:20px; border-radius:50%;
      border:2px solid rgba(255,255,255,0.28); background:#0d0d0d;
      cursor:pointer; position:absolute; left:16px; top:50%; transform:translateY(-50%); margin:0; padding:0;
      transition:border-color .2s, background .2s;
    }
    .checkbox-item input[type="checkbox"]:hover{ border-color:var(--red-soft); }
    .checkbox-item input[type="checkbox"]:checked{
      background:var(--red-soft); border-color:var(--red-soft);
    }
    .checkbox-item input[type="checkbox"]:checked::after{
      content:''; position:absolute; left:50%; top:44%;
      width:5px; height:9px; border:solid #fff; border-width:0 2px 2px 0;
      transform:translate(-50%,-50%) rotate(45deg);
    }
    .checkbox-item span{ display:block; font-size:14.5px; color:var(--white); line-height:1.4; }
    .checkbox-item.checked{ border-color:var(--red-soft); background:rgba(200,30,44,0.1); }
    /* หัวข้อคั่นกลุ่มฟิลด์เพิ่มเติมของแต่ละบริการที่ติ๊กไว้ */
    .service-group-title{
      display:flex; align-items:center; gap:8px;
      font-size:12.5px; font-weight:600; color:#ff8a93; letter-spacing:0.3px;
      margin:18px 0 12px 0; padding-bottom:8px; border-bottom:1px solid var(--border);
    }
    .service-group-title:before{ content:'▸'; color:var(--red-soft); font-size:13px; }
    .file-drop{
      border:1.5px dashed var(--border); border-radius:12px; padding:18px; text-align:center;
      cursor:pointer; color:var(--gray); font-size:13px; transition:border-color .2s, background .2s; position:relative;
    }
    .file-drop:hover{ border-color:var(--red-soft); background:rgba(200,30,44,0.06); }
    .file-drop input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
    .file-drop.has-file{ border-color:var(--red-soft); color:var(--white); }
    /* ===== Preview รูปที่เลือกไว้หลายรูป (thumbnail grid + ปุ่มลบ) ===== */
    .image-preview-list{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
    .image-preview-item{
      position:relative; width:84px; height:84px; border-radius:10px; overflow:hidden;
      border:1px solid var(--border); flex-shrink:0;
    }
    .image-preview-item img{ width:100%; height:100%; object-fit:cover; display:block; }
    .image-preview-item .remove-btn{
      position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%;
      background:rgba(0,0,0,0.65); color:#fff; border:none; font-size:12px; line-height:20px;
      text-align:center; cursor:pointer; padding:0; font-family:'Kanit', sans-serif;
    }
    .image-preview-item .remove-btn:hover{ background:var(--red); }
    .slot-hint{ font-size:12px; color:var(--gray); margin-top:6px; }
    /* ===== ฟิลด์แผนที่: ปักหมุดตำแหน่งร้าน/จุดที่ต้องการให้เข้าบริการ ===== */
    .map-field-wrap{ margin-bottom:20px; }
    .map-container{
      width:100%; height:230px; border-radius:12px; overflow:hidden;
      border:1px solid var(--border); background:#141414;
    }
    .map-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; flex-wrap:wrap; }
    .map-locate-btn{
      display:inline-flex; align-items:center; gap:6px; background:#141414; border:1px solid var(--border);
      color:var(--white); font-family:'Kanit', sans-serif; font-size:12.5px; font-weight:500;
      padding:8px 14px; border-radius:999px; cursor:pointer; transition:border-color .2s, background .2s;
    }
    .map-locate-btn:hover{ border-color:var(--red-soft); background:rgba(200,30,44,0.1); }
    .map-locate-btn svg{ width:14px; height:14px; flex-shrink:0; }
    .map-coords-hint{ font-size:12px; color:var(--gray); }
    .map-coords-hint.picked{ color:#7be6a5; }
    /* Leaflet dark-map polish so it blends with the card */
    .leaflet-container{ background:#141414; font-family:'Kanit', sans-serif; }
    .leaflet-control-attribution{ background:rgba(13,13,13,0.75) !important; color:#8a8a8a !important; font-size:9.5px !important; }
    .leaflet-control-attribution a{ color:#b0b0b0 !important; }
    .leaflet-control-zoom a{ background:#141414 !important; color:#fff !important; border-color:var(--border) !important; }
    .leaflet-control-zoom a:hover{ background:#1f1f1f !important; }
    .submit-btn{
      width:100%; padding:14px; border:none; border-radius:12px;
      background:linear-gradient(90deg, var(--red) 0%, var(--red-soft) 100%);
      color:var(--white); font-family:'Kanit', sans-serif; font-size:16px; font-weight:600;
      letter-spacing:0.5px; cursor:pointer; margin-top:8px;
      transition:transform .15s, box-shadow .15s, opacity .15s; box-shadow:0 10px 30px rgba(200,30,44,0.35);
    }
    .submit-btn:hover{ transform:translateY(-1px); box-shadow:0 14px 34px rgba(200,30,44,0.45); }
    .submit-btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none; }
    .alert{ display:none; padding:12px 14px; border-radius:10px; font-size:14px; margin-bottom:18px; font-weight:400; line-height:1.5; }
    .alert.success{ background:rgba(46,204,113,0.12); border:1px solid rgba(46,204,113,0.4); color:#7be6a5; }
    .alert.error{ background:rgba(200,30,44,0.12); border:1px solid rgba(200,30,44,0.5); color:#ff8a93; }
    /* ===== แถบแจ้งเตือน "พบร่างข้อมูลที่ยังไม่เสร็จ" (บันทึกอัตโนมัติด้วย localStorage) ===== */
    .draft-banner{
      display:none; background:rgba(37,99,235,0.1); border:1px solid rgba(37,99,235,0.35);
      border-radius:10px; padding:14px 16px; margin-bottom:18px; gap:12px;
      align-items:center; justify-content:space-between; flex-wrap:wrap;
    }
    .draft-banner.active{ display:flex; }
    .draft-banner-text{ display:flex; flex-direction:column; gap:2px; flex:1; min-width:180px; }
    .draft-banner-text span:first-child{ color:#bcd2ff; font-size:13.5px; font-weight:600; }
    .draft-banner-sub{ color:#8aa5d8; font-size:11.5px; }
    .draft-banner-actions{ display:flex; gap:8px; flex-shrink:0; }
    .draft-banner-actions button{
      font-family:'Kanit', sans-serif; font-size:12.5px; font-weight:600; padding:8px 14px;
      border-radius:8px; cursor:pointer; border:1px solid transparent; transition:background .2s, border-color .2s, color .2s;
    }
    #draftRestoreBtn{ background:#2563eb; color:#fff; }
    #draftRestoreBtn:hover{ background:#1d4ed8; }
    #draftDiscardBtn{ background:transparent; border-color:rgba(255,255,255,0.15); color:#9a9a9a; }
    #draftDiscardBtn:hover{ border-color:var(--red-soft); color:#ff8a93; }
    @media (max-width:480px){
      .draft-banner{ flex-direction:column; align-items:stretch; }
      .draft-banner-actions{ justify-content:flex-end; }
    }
    .footer-note{ text-align:center; color:var(--gray); font-size:12px; margin-top:22px; font-weight:300; }
    .info-box{
      background:rgba(200,30,44,0.08); border:1px solid rgba(200,30,44,0.3); border-radius:10px;
      padding:14px 16px; font-size:13.5px; color:#e8e8e8; line-height:1.6;
    }
    .info-box .info-title{ color:#ff8a93; font-weight:600; font-size:12px; letter-spacing:0.3px; margin-bottom:6px; }
    /* ===== หน้าสรุปก่อนยืนยันการจอง (review step) ===== */
    .review-overlay{
      position:fixed; inset:0; background:rgba(0,0,0,0.72); backdrop-filter:blur(4px);
      z-index:1000; display:none; align-items:center; justify-content:center; padding:20px;
    }
    .review-overlay.active{ display:flex; }
    .review-card{
      background:linear-gradient(160deg, rgba(26,26,26,0.97), rgba(13,13,13,0.98));
      border:1px solid var(--border); border-radius:20px; padding:26px 24px;
      max-width:520px; width:100%; max-height:85vh; overflow-y:auto;
      box-shadow:0 25px 70px rgba(0,0,0,0.65);
    }
    .review-title{ font-size:19px; font-weight:700; color:#fff; margin-bottom:4px; }
    .review-subtitle{ font-size:13px; color:var(--gray); margin-bottom:16px; line-height:1.5; }
    .review-row{
      display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
      padding:11px 0; border-bottom:1px solid var(--border); font-size:13.5px;
    }
    .review-row:last-child{ border-bottom:none; }
    .review-row .rlabel{ color:var(--gray); flex-shrink:0; width:42%; line-height:1.4; }
    .review-row .rvalue{ color:#fff; font-weight:500; text-align:right; word-break:break-word; line-height:1.4; flex:1; }
    .review-images{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; flex:1; }
    .review-images img{ width:42px; height:42px; object-fit:cover; border-radius:6px; border:1px solid var(--border); }
    .review-actions{ display:flex; gap:10px; margin-top:20px; }
    .review-actions button{
      flex:1; padding:13px; border-radius:10px; font-family:'Kanit', sans-serif;
      font-size:14.5px; font-weight:600; cursor:pointer; border:none; transition:transform .15s, opacity .15s;
    }
    .review-edit-btn{ background:#1a1a1a; border:1px solid var(--border) !important; color:#fff; }
    .review-edit-btn:hover{ border-color:var(--red-soft) !important; background:rgba(200,30,44,0.08); }
    .review-confirm-btn{
      background:linear-gradient(90deg, var(--red) 0%, var(--red-soft) 100%); color:#fff;
      box-shadow:0 10px 24px rgba(200,30,44,0.35);
    }
    .review-confirm-btn:hover{ transform:translateY(-1px); }
    .review-confirm-btn:disabled{ opacity:0.55; cursor:not-allowed; transform:none; }
    @media (max-width:480px){
      .review-card{ padding:20px 18px; max-height:88vh; }
      .review-row{ flex-direction:column; gap:3px; }
      .review-row .rvalue{ text-align:left; }
      .review-images{ justify-content:flex-start; }
    }

    /* ===== ปุ่มลอย LINE OA มุมขวาล่าง ===== */
    .line-float-btn{
      position:fixed; right:20px; bottom:20px; z-index:999;
      width:58px; height:58px; border-radius:50%;
      background:#06C755; display:flex; align-items:center; justify-content:center;
      box-shadow:0 8px 24px rgba(6,199,85,0.45), 0 2px 8px rgba(0,0,0,0.3);
      text-decoration:none; transition:transform .2s, box-shadow .2s;
      animation:lineFloatPulse 2.4s ease-in-out infinite;
    }
    .line-float-btn:hover{ transform:translateY(-2px) scale(1.05); box-shadow:0 12px 30px rgba(6,199,85,0.55), 0 2px 8px rgba(0,0,0,0.3); }
    .line-float-btn svg{ width:30px; height:30px; }
    @keyframes lineFloatPulse{
      0%, 100%{ box-shadow:0 8px 24px rgba(6,199,85,0.45), 0 0 0 0 rgba(6,199,85,0.5); }
      50%{ box-shadow:0 8px 24px rgba(6,199,85,0.45), 0 0 0 6px rgba(6,199,85,0); }
    }
    /* ===== ปุ่มลอยแชทสด (Tawk.to) มุมขวาล่าง วางซ้อนเหนือปุ่ม LINE =====
       ใช้ widget ของตัวเองแทน bubble เริ่มต้นของ Tawk (ถูกซ่อนถาวรด้วย CSS ด้านล่าง + JS hideWidget()) */
    .chat-float-btn{
      position:fixed; right:20px; bottom:100px; z-index:999;
      width:58px; height:58px; border-radius:50%; border:none; padding:0;
      background:#2563eb; display:flex; align-items:center; justify-content:center;
      box-shadow:0 8px 24px rgba(37,99,235,0.45), 0 2px 8px rgba(0,0,0,0.3);
      cursor:pointer; transition:transform .2s, box-shadow .2s;
    }
    .chat-float-btn:hover{ transform:translateY(-2px) scale(1.05); box-shadow:0 12px 30px rgba(37,99,235,0.55), 0 2px 8px rgba(0,0,0,0.3); }
    .chat-float-btn svg{ width:28px; height:28px; }
    /* ===== ซ่อน widget เริ่มต้นของ Tawk.to แบบถาวรด้วย CSS (กันปุ่มแดงเริ่มต้นโผล่มาซ้อนปุ่มที่สร้างเอง) =====
       ทำงานทันทีที่ CSS โหลด ไม่ต้องรอ JS ของ Tawk โหลดเสร็จก่อน จึงกันปัญหา "โผล่มาแวบนึงก่อนถูกซ่อน" ได้ */
    #tawkchat-container, .tawk-min-container, iframe[title="chat widget"]{
      visibility:hidden !important;
      opacity:0 !important;
      pointer-events:none !important;
    }
    @media (max-width:480px){
      .grid-2{ grid-template-columns:1fr; }
      .checkbox-group{ grid-template-columns:1fr; }
      .header h1{ font-size:27px; }
      .card{ padding:24px 18px; border-radius:16px; }
      .lang-switch{ position:static; display:inline-flex; margin-bottom:14px; }
      .line-float-btn{ right:14px; bottom:14px; width:52px; height:52px; }
      .line-float-btn svg{ width:27px; height:27px; }
      .chat-float-btn{ right:14px; bottom:82px; width:52px; height:52px; }
      .chat-float-btn svg{ width:25px; height:25px; }
      .map-container{ height:200px; }
    }
    .flatpickr-calendar{ background:#141414; border:1px solid var(--border); box-shadow:0 20px 50px rgba(0,0,0,0.6); font-family:'Kanit', sans-serif; }
    .flatpickr-calendar.arrowTop:before, .flatpickr-calendar.arrowTop:after{ display:none; }
    .flatpickr-months{ background:#141414; }
    .flatpickr-current-month{ color:var(--white); font-family:'Kanit', sans-serif; }
    .flatpickr-current-month input.cur-year{ color:var(--white); }
    .flatpickr-monthDropdown-months{ background:#141414; color:var(--white); }
    .flatpickr-weekday{ background:#141414; color:var(--gray); }
    .flatpickr-day{ color:var(--white); }
    .flatpickr-day.flatpickr-disabled{ color:#4a4a4a; }
    .flatpickr-day.today{ border-color:var(--red-soft); }
    .flatpickr-day.selected, .flatpickr-day.selected:hover{ background:var(--red); border-color:var(--red); }
    .flatpickr-day:hover{ background:rgba(200,30,44,0.25); }
    .flatpickr-prev-month svg, .flatpickr-next-month svg{ fill:var(--gray); }
    .flatpickr-prev-month:hover svg, .flatpickr-next-month:hover svg{ fill:var(--red-soft); }
    .spinner{
      display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.4);
      border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;
      vertical-align:middle; margin-right:8px;
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="lang-switch" id="langSwitch">
      <button type="button" class="lang-opt" data-lang="TH">ไทย</button>
      <button type="button" class="lang-opt" data-lang="EN">EN</button>
      <button type="button" class="lang-opt" data-lang="ZH">中文</button>
    </div>

    <div class="header">
      <span class="badge" id="badgeText">ระบบจองคิว</span>
      <h1 id="pageTitle">ระบบจองคิว</h1>
      <p id="pageSubtitle">กรอกข้อมูลเพื่อทำการจองคิวบริการ</p>
    </div>

    <div class="card">
      <!-- ===== แถบแจ้งเตือนถ้าพบร่างข้อมูลเดิมที่บันทึกไว้อัตโนมัติ (localStorage) - โผล่ก่อนฟอร์มเสมอถ้ามี ===== -->
      <div class="draft-banner" id="draftBanner">
        <div class="draft-banner-text">
          <span id="draftBannerTitle">พบร่างข้อมูลที่ยังไม่เสร็จ</span>
          <span class="draft-banner-sub" id="draftBannerSub"></span>
        </div>
        <div class="draft-banner-actions">

    // ค่าเริ่มต้น: ศูนย์กลางกรุงเทพฯ - ยังไม่ถือว่าลูกค้า "ปักหมุด" จนกว่าจะแตะแผนที่ / ลากหมุด / กดใช้ตำแหน่งปัจจุบัน
    const DEFAULT_MAP_CENTER = [13.7563, 100.5018];
    let selectedLat = null;
    let selectedLng = null;
    let hasPickedLocation = false;
    // ===== ใช้สำหรับ debounce + ยกเลิกผลลัพธ์เก่าของการค้นหาที่อยู่จากพิกัด (reverse geocoding) =====
    let reverseGeocodeTimer = null;
    let reverseGeocodeToken = 0;

    const locationMap = L.map('locationMap', { attributionControl: true }).setView(DEFAULT_MAP_CENTER, 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(locationMap);

    const locationMarker = L.marker(DEFAULT_MAP_CENTER, { draggable: true }).addTo(locationMap);

    function setPickedLocation(lat, lng, recenter) {
      selectedLat = lat;
      selectedLng = lng;
      hasPickedLocation = true;
      locationMarker.setLatLng([lat, lng]);
      if (recenter) locationMap.setView([lat, lng], 16);
      updateMapCoordsHint();
      scheduleDraftSave();
      scheduleReverseGeocode_(lat, lng);
    }

    /**
     * เว้นจังหวะก่อนยิงคำขอค้นหาที่อยู่จากพิกัด (reverse geocoding) เพื่อไม่ให้ยิงถี่เกินไปตอนลากหมุด
     * และเพื่อเคารพนโยบายการใช้งานของ Nominatim (จำกัดที่ประมาณ 1 คำขอ/วินาที)
     */
    function scheduleReverseGeocode_(lat, lng) {
      if (isApplyingDraft) return; // ไม่ยิงคำขอตอนกำลังกู้คืนร่างข้อมูล กันที่อยู่ที่เคยแก้ไขไว้เองถูกเขียนทับ
      clearTimeout(reverseGeocodeTimer);
      reverseGeocodeTimer = setTimeout(function () {
        fillAddressFromCoords_(lat, lng);
      }, 600);
    }

    /**
     * เรียก Nominatim (OpenStreetMap) แปลงพิกัดกลับเป็นที่อยู่ แล้วเติมลงช่อง "ที่อยู่ของร้าน" ให้อัตโนมัติ
     * ใช้ token กันผลลัพธ์เก่าเขียนทับค่าล่าสุด ถ้าผู้ใช้ปักหมุดใหม่ระหว่างรอผลลัพธ์เดิม
     */
    function fillAddressFromCoords_(lat, lng) {
      const t = I18N[currentLang];
      const myToken = ++reverseGeocodeToken;
      const langCode = currentLang === 'TH' ? 'th' : (currentLang === 'ZH' ? 'zh' : 'en');
      mapCoordsHint.textContent = t.mapAddressLoading;
      const url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lng +
        '&zoom=18&addressdetails=1&accept-language=' + langCode;
      fetch(url, { headers: { 'Accept': 'application/json' } })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (myToken !== reverseGeocodeToken) return; // มีการปักหมุดใหม่ระหว่างรอ ไม่ใช้ผลลัพธ์นี้แล้ว
          updateMapCoordsHint();
          const address = data && data.display_name;
          if (address) {
            document.getElementById('shopAddress').value = address;
            scheduleDraftSave();
          }
        })
        .catch(function () {
          if (myToken !== reverseGeocodeToken) return;
          updateMapCoordsHint(); // ค้นหาที่อยู่ไม่สำเร็จ - เงียบๆ กลับไปโชว์พิกัดตามเดิม ลูกค้ากรอกที่อยู่เองได้
        });
    }

    function updateMapCoordsHint() {
      const t = I18N[currentLang];
      if (hasPickedLocation && selectedLat !== null && selectedLng !== null) {
        mapCoordsHint.textContent = t.mapPicked + ' (' + selectedLat.toFixed(5) + ', ' + selectedLng.toFixed(5) + ')';
        mapCoordsHint.classList.add('picked');
      } else {
        mapCoordsHint.textContent = t.mapNotPicked;
        mapCoordsHint.classList.remove('picked');
      }
    }

        },

    function renderServiceTypeCheckboxes(preserveValues) {
      const lang = currentLang;

      serviceTypeGroupEl.innerHTML = '';
      SERVICE_TYPES.forEach(function (t) {

        item.classList.toggle('checked', input.checked);
        serviceTypeGroupEl.appendChild(item);

    // เรนเดอร์ฟิลด์เพิ่มเติมของทุกบริการที่ติ๊กไว้ เรียงเป็นชุดๆ พร้อมหัวข้อคั่นแต่ละชุด
    // ถ้าไม่ติ๊กอะไรเลย จะไม่มีฟิลด์อะไรโผล่ขึ้นมาเลย
    function renderDynamicFields() {
      const container = document.getElementById('dynamicFields');
      const lang = currentLang;
      const selected = getSelectedServiceTypes();

      // เก็บค่าที่กรอกไว้ก่อนเรนเดอร์ใหม่ (กันข้อมูลหายตอนสลับภาษา/ติ๊กเพิ่ม)
      const savedValues = {};
      selected.forEach(function (svc) {
        (DYNAMIC_FIELDS[svc] || []).forEach(function (f) {
          const el = document.getElementById(f.id);
          if (el) savedValues[f.id] = el.value;
        });
      });

      extraDatePickers.forEach(function (p) { p.destroy(); });
      extraDatePickers = [];
      container.innerHTML = '';

      selected.forEach(function (svc) {
        const fields = DYNAMIC_FIELDS[svc] || [];
        if (fields.length === 0) return;

        const svcMeta = SERVICE_TYPES.find(function (t) { return t.value === svc; });
        const title = document.createElement('div');
        title.className = 'service-group-title';
        title.textContent = svcMeta ? svcMeta.label[lang] : svc;
        container.appendChild(title);

        fields.forEach(function (f) {
          const wrap = document.createElement('div');
          wrap.className = 'field';

          const label = document.createElement('label');
          label.textContent = f.label[lang];
          wrap.appendChild(label);

          let inputEl;
          if (f.type === 'select') {
            inputEl = document.createElement('select');
            inputEl.id = f.id;
            // ตัวเลือกว่างไว้ก่อน: ไม่บังคับให้ต้องเลือกรายละเอียดของบริการนี้ ถ้าไม่จำเป็นก็ปล่อยว่างไว้ได้
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = lang === 'EN' ? '-- Not specified --' : (lang === 'ZH' ? '-- 未指定 --' : '-- ไม่ระบุ --');
            inputEl.appendChild(placeholder);
            f.options.forEach(function (opt) {
              const o = document.createElement('option');
              o.value = opt.value; o.textContent = opt.label[lang];
              inputEl.appendChild(o);
            });
          } else if (f.type === 'textarea') {
            inputEl = document.createElement('textarea');
            inputEl.id = f.id;
            if (f.placeholder) inputEl.placeholder = f.placeholder[lang];
          } else {
            inputEl = document.createElement('input');
            inputEl.type = 'text';
            inputEl.id = f.id;
            inputEl.autocomplete = 'off';
            if (f.placeholder) inputEl.placeholder = f.placeholder[lang];
            if (f.type === 'date') { inputEl.readOnly = true; }
          }
          wrap.appendChild(inputEl);
          container.appendChild(wrap);

          if (savedValues[f.id] !== undefined) inputEl.value = savedValues[f.id];

          if (f.type === 'date') {
            const picker = flatpickr('#' + f.id, {
              dateFormat: 'Y-m-d', altInput: true, altFormat: I18N[lang].altFormat,
              minDate: today, disableMobile: true,
              locale: resolveFlatpickrLocale_(I18N[lang].flatpickrLocale)
            });
            extraDatePickers.push(picker);
            if (savedValues[f.id]) picker.setDate(savedValues[f.id], true);
          }
        });
      });
    }

    // ===== ประเภทบริการที่ไม่รองรับตัวเลือก "ส่งเครื่องอุปกรณ์ไปยังศูนย์บริการ" (ต้องมีช่างไปหน้างานจริง) =====
    const FULFILLMENT_RESTRICTED_SERVICE_TYPES = ['INSTALLATION', 'NEW_RESTAURANT_OPENING', 'RESTAURANT_RELOCATION'];
    const SHIP_TO_CENTER_VALUE = 'SHIP_TO_CENTER';

    function isShipToCenterAllowed_() {
      const selected = getSelectedServiceTypes();
      return !selected.some(function (s) { return FULFILLMENT_RESTRICTED_SERVICE_TYPES.indexOf(s) > -1; });
    }

    // เรนเดอร์ตัวเลือกใน dropdown "บริการที่ต้องการ" (คงค่าที่เลือกไว้เดิมได้ตอนสลับภาษา)
    // ถ้าติ๊กประเภทบริการที่ไม่รองรับ SHIP_TO_CENTER ไว้ จะซ่อนตัวเลือกนั้นออกจากรายการ
    function renderFulfillmentOptions(preserveValue) {
      const sel = document.getElementById('fulfillmentType');
      const lang = currentLang;
      const prevVal = preserveValue ? sel.value : '';
      const shipAllowed = isShipToCenterAllowed_();
      sel.innerHTML = '';
      const def = document.createElement('option');
      def.value = ''; def.textContent = I18N[lang].fulfillmentDefaultOpt;
      sel.appendChild(def);
      FULFILLMENT_TYPES.forEach(function (f) {
        if (f.value === SHIP_TO_CENTER_VALUE && !shipAllowed) return; // ปิดตัวเลือกนี้เมื่อเลือกบริการที่ไม่รองรับ
        const o = document.createElement('option');
        o.value = f.value; o.textContent = f.label[lang];
        sel.appendChild(o);
      });
      // ถ้าค่าที่เคยเลือกไว้คือ SHIP_TO_CENTER แต่ตอนนี้ถูกปิดไปแล้ว ให้ล้างค่าทิ้ง ไม่ preserve ค่าที่ใช้ไม่ได้แล้ว
      if (prevVal && (prevVal !== SHIP_TO_CENTER_VALUE || shipAllowed)) {
        sel.value = prevVal;
      } else {
        sel.value = '';
      }
    }

    document.getElementById('fulfillmentType').addEventListener('change', function () {

          const placeholder = document.createElement('option');
          placeholder.value = '';

          inputEl.appendChild(placeholder);
          f.options.forEach(function (opt) {

            o.value = opt.value; o.textContent = opt.label[lang];

          });
        } else if (f.type === 'textarea') {

    function refreshAvailableSlots(forcedPreviousTime) {
      const t = I18N[currentLang];
      const selected = getSelectedServiceTypes();
      const date = bookingDateEl.value;

      // ===== เก็บเวลาที่ผู้ใช้เคยเลือกไว้ก่อนรีเซ็ต dropdown =====
      // (กันปัญหาเวลาที่เคยเลือกหายไปเงียบๆ ทุกครั้งที่ติ๊ก/ถอดติ๊กประเภทบริการ)
      // ถ้ามีการส่ง forcedPreviousTime เข้ามา (เช่นตอนกู้คืนร่างข้อมูล) จะใช้ค่านั้นแทนค่าที่ dropdown มีอยู่ตอนนี้
      const previousTime = forcedPreviousTime !== undefined ? forcedPreviousTime : bookingTimeEl.value;

      bookingTimeEl.innerHTML = '';
      slotHint.textContent = '';

      if (selected.length === 0 || !date) {
        bookingTimeEl.disabled = true;
        const opt = document.createElement('option');
        opt.value = ''; opt.textContent = t.timeDefaultOpt;
        bookingTimeEl.appendChild(opt);
        return;
      }

      bookingTimeEl.disabled = true;
      const loadingOpt = document.createElement('option');
      loadingOpt.value = ''; loadingOpt.textContent = t.timeLoading;
      bookingTimeEl.appendChild(loadingOpt);

      const url = APPS_SCRIPT_URL + '?action=getAvailableSlots&serviceTypes=' + encodeURIComponent(selected.join(',')) + '&date=' + encodeURIComponent(date);

      fetch(url)
        .then(function (res) { return res.json(); })
        .then(function (slots) {
          const t2 = I18N[currentLang];
          bookingTimeEl.innerHTML = '';
          if (!slots || slots.error || slots.length === 0) {
            const opt = document.createElement('option');
            opt.value = ''; opt.textContent = t2.timeNoSlot;
            bookingTimeEl.appendChild(opt);
            bookingTimeEl.disabled = true;
            slotHint.textContent = t2.slotPickOther;

            // ===== วันนี้คิวเต็มแล้ว: ขึ้น alert แดงแจ้งขออภัยให้เห็นชัดเจนทันที =====
            // (ไม่ขึ้นซ้ำถ้าเป็น error จาก slots.error เพราะกรณีนั้นเป็นข้อผิดพลาดของระบบ ไม่ใช่คิวเต็ม)
            if (!slots || !slots.error) {
              showAlert('error', t2.fullyBookedMsg);
            }
            return;
          }

          // มีคิวว่าง: ซ่อน alert เดิม (ถ้าเคยขึ้นว่าคิวเต็มจากการเช็ควันก่อนหน้า)
          alertBox.style.display = 'none';

          const placeholder = document.createElement('option');
          placeholder.value = ''; placeholder.textContent = t2.timePickOpt;
          bookingTimeEl.appendChild(placeholder);
          slots.forEach(function (s) {
            const opt = document.createElement('option');
            opt.value = s; opt.textContent = s + t2.timeSuffix;
            bookingTimeEl.appendChild(opt);
          });
          bookingTimeEl.disabled = false;
          slotHint.textContent = t2.slotRemain(slots.length);

          // ===== ถ้าเวลาที่เคยเลือกไว้ยังว่างอยู่ในรายการใหม่ ให้เลือกคืนให้อัตโนมัติ =====
          if (previousTime && slots.indexOf(previousTime) > -1) {
            bookingTimeEl.value = previousTime;
          } else if (previousTime) {
            // เวลาที่เคยเลือกไว้ไม่ว่างแล้ว แจ้งเตือนผู้ใช้ให้เลือกใหม่แทนที่จะปล่อยให้หายเงียบๆ
            slotHint.textContent = t2.slotRemain(slots.length) +
              (currentLang === 'EN' ? ' — your previous time is no longer available, please pick again.' :
               currentLang === 'ZH' ? ' — 您之前选择的时间已不可用，请重新选择。' :
               ' — เวลาที่เคยเลือกไว้ไม่ว่างแล้ว กรุณาเลือกใหม่');
          }
        })
        .catch(function (err) {
          const t2 = I18N[currentLang];
          bookingTimeEl.innerHTML = '<option value="">' + t2.timeErr + '</option>';
          slotHint.textContent = err.message || t2.timeErr;
        });
    }

    // ===== เลือกรูปได้หลายรูป: อ่านทีละไฟล์ด้วย FileReader แล้วเก็บลง selectedImages =====
    imageInput.addEventListener('change', function (e) {
      const files = Array.from(e.target.files || []);
      if (files.length === 0) return;
      let pending = files.length;
      files.forEach(function (file) {
        const reader = new FileReader();
        reader.onload = function (evt) {
          selectedImages.push({ base64: evt.target.result, fileName: file.name, mimeType: file.type });
          pending -= 1;
          if (pending === 0) {
            imageInput.value = ''; // เคลียร์ค่า input เพื่อให้เลือกไฟล์ซ้ำเดิมเพิ่มได้อีกในครั้งถัดไป
            renderImagePreviews();
          }
        };
        reader.readAsDataURL(file);
      });
    });

    function renderImagePreviews() {
      const t = I18N[currentLang];
      imagePreviewList.innerHTML = '';
      selectedImages.forEach(function (img, idx) {
        const item = document.createElement('div');
        item.className = 'image-preview-item';

        const imgEl = document.createElement('img');
        imgEl.src = img.base64;
        imgEl.alt = img.fileName || '';

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-btn';
        removeBtn.textContent = '✕';
        removeBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          selectedImages.splice(idx, 1);
          renderImagePreviews();
        });

        item.appendChild(imgEl);
        item.appendChild(removeBtn);
        imagePreviewList.appendChild(item);
      });

      if (selectedImages.length > 0) {
        fileDropText.textContent = t.imagesSelected(selectedImages.length);
        fileDrop.classList.add('has-file');
      } else {
        fileDropText.textContent = t.fileDropText;
        fileDrop.classList.remove('has-file');
      }
    }

    function showAlert(type, message) {

    function collectFormData() {
      const selected = getSelectedServiceTypes();

      // ===== สร้างข้อความหัวข้อบริการที่แนบรหัสแผนกกำกับไว้ สำหรับใช้ฝั่งหลังบ้าน (Sheet/Email) เท่านั้น =====
      // เช่น "ซ่อม (REPAIR) [OP], ตรวจเช็คเครื่อง (INSPECTION) [EN]"
      // ลูกค้าไม่เห็นข้อความนี้ในหน้าเว็บ เพราะสร้างขึ้นตอนรวบรวมข้อมูลก่อนส่งเท่านั้น
      const serviceTypesLabeled = selected.map(function (svc) {
        const meta = SERVICE_TYPES.find(function (t) { return t.value === svc; });
        const label = meta ? meta.label.TH : svc;
        const code = SERVICE_DEPARTMENT_CODE[svc] || '';
        return code ? (label + ' [' + code + ']') : label;
      });

      // รหัสแผนกล้วนๆ แบบไม่ซ้ำ เผื่อฝั่งหลังบ้านอยากใช้แยกคอลัมน์ / กรองอีเมลตามแผนก
      const departmentCodes = Array.from(new Set(
        selected.map(function (svc) { return SERVICE_DEPARTMENT_CODE[svc] || ''; }).filter(Boolean)
      ));

      const data = {
        serviceTypes: selected,
        serviceTypesLabeled: serviceTypesLabeled, // ===== หัวข้อบริการ + รหัสแผนก สำหรับ Sheet/Email =====
        departmentCodes: departmentCodes,          // ===== รหัสแผนกล้วนๆ เช่น ["OP","PJ"] =====
        contactName: document.getElementById('contactName').value.trim(),
        shopAddress: document.getElementById('shopAddress').value.trim(),
        // ===== พิกัดที่ลูกค้าปักหมุดไว้บนแผนที่ (ถ้ามี) - ใช้แปลงเป็นลิงก์ Google Maps ฝั่งหลังบ้าน =====
        mapLat: hasPickedLocation && selectedLat !== null ? selectedLat.toFixed(6) : '',
        mapLng: hasPickedLocation && selectedLng !== null ? selectedLng.toFixed(6) : '',
        kitchenInfo: document.getElementById('kitchenInfo').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        customerEmail: document.getElementById('customerEmail').value.trim(),
        bookingDate: bookingDateEl.value,
        bookingTime: bookingTimeEl.value,
        images: selectedImages, // ===== ส่งรูปทั้งหมดเป็น array [{base64, fileName, mimeType}, ...] =====
        customerType: customerType,
        language: currentLang
      };
      let extraFields = [];
      selected.forEach(function (svc) {
        extraFields = extraFields.concat(DYNAMIC_FIELDS[svc] || []);
      });
      extraFields.forEach(function (f) {
        const el = document.getElementById(f.id);
        if (el) data[f.id] = (el.value || '').trim();
      });

      const fulfillment = document.getElementById('fulfillmentType').value;
      data.fulfillmentType = fulfillment;
      const fFields = FULFILLMENT_FIELDS[fulfillment] || [];
      fFields.forEach(function (f) {
        const el = document.getElementById(f.id);
        if (!el) return;
        data[f.id] = (el.value || '').trim();
      });
      return data;
    }

    /**
     * แปลงวันที่ yyyy-MM-dd ให้อ่านง่ายตามภาษา สำหรับใช้แสดงในหน้าสรุปก่อนยืนยัน (ฝั่งหน้าเว็บ)
     */
    function formatDateDisplay_(dateStr, lang) {
      if (!dateStr) return '-';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const y = Number(parts[0]);
      const m = Number(parts[1]);
      const d = Number(parts[2]);
      if (lang === 'TH') {
        const thaiMonths = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
          'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
        return d + ' ' + (thaiMonths[m - 1] || m) + ' ' + (y + 543);
      }
      if (lang === 'ZH') return y + '年' + m + '月' + d + '日';
      const months = ['January','February','March','April','May','June',
        'July','August','September','October','November','December'];
      return (months[m - 1] || m) + ' ' + d + ', ' + y;
    }

    /**
     * รวบรวม {label, value} ทุกฟิลด์ที่ลูกค้ากรอกไว้ เพื่อแสดงในหน้าสรุปก่อนยืนยัน (review step)
     * ใช้ label เดียวกับที่แสดงในฟอร์มจริง เพื่อให้ลูกค้าจำได้ตรงกัน
     */
    function buildReviewRows_(formData) {
      const lang = currentLang;
      const t = I18N[lang];
      const rows = [];

      const serviceLabel = (formData.serviceTypes || []).map(function (v) {
        const m = SERVICE_TYPES.find(function (s) { return s.value === v; });
        return m ? m.label[lang] : v;
      }).join(' + ');
      rows.push({ label: t.serviceType, value: serviceLabel || t.notSpecified });

      (formData.serviceTypes || []).forEach(function (svc) {
        (DYNAMIC_FIELDS[svc] || []).forEach(function (f) {
          const raw = formData[f.id];
          if (!raw) return;
          let val = raw;
          if (f.type === 'select') {
            const opt = f.options.find(function (o) { return o.value === raw; });
            val = opt ? opt.label[lang] : raw;
          } else if (f.type === 'date') {
            val = formatDateDisplay_(raw, lang);
          }
          rows.push({ label: f.label[lang], value: val });
        });
      });

      const fm = FULFILLMENT_TYPES.find(function (f) { return f.value === formData.fulfillmentType; });
      rows.push({ label: t.fulfillment, value: fm ? fm.label[lang] : t.notSpecified });

      if (formData.fulfillmentType === 'SHIP_TO_CENTER') {
        rows.push({ label: t.shipCenterAddressLabel, value: MK_WAREHOUSE_ADDRESS });
      } else {
        (FULFILLMENT_FIELDS[formData.fulfillmentType] || []).forEach(function (f) {
          const raw = formData[f.id];
          if (!raw) return;
          let val = raw;
          if (f.type === 'select') {
            const opt = f.options.find(function (o) { return o.value === raw; });
            val = opt ? opt.label[lang] : raw;
          } else if (f.type === 'date') {
            val = formatDateDisplay_(raw, lang);
          }
          rows.push({ label: f.label[lang], value: val });
        });
      }

      rows.push({ label: t.contactName, value: formData.contactName || t.notSpecified });
      rows.push({ label: t.phone, value: formData.phone || t.notSpecified });
      if (formData.customerEmail) rows.push({ label: t.email, value: formData.customerEmail });
      if (formData.shopAddress) rows.push({ label: t.shopAddress, value: formData.shopAddress });
      rows.push({
        label: t.mapLabel,
        value: (formData.mapLat && formData.mapLng) ? (formData.mapLat + ', ' + formData.mapLng) : t.mapNotPicked
      });
      if (formData.kitchenInfo) rows.push({ label: t.kitchenInfo, value: formData.kitchenInfo });
      rows.push({ label: t.dateLabel, value: formatDateDisplay_(formData.bookingDate, lang) });
      rows.push({ label: t.timeLabel, value: formData.bookingTime + t.timeSuffix });
      return rows;
    }

    /**
     * เรนเดอร์ + เปิดหน้าสรุปก่อนยืนยัน (review step) จากข้อมูลที่ผ่านการตรวจครบถ้วนแล้ว
     */
    function showReviewModal_(formData) {
      const lang = currentLang;
      const t = I18N[lang];
      document.getElementById('reviewTitle').textContent = t.reviewTitle;
      document.getElementById('reviewSubtitle').textContent = t.reviewSubtitle;
      reviewEditBtn.textContent = t.reviewEditBtn;
      reviewConfirmBtn.textContent = t.submitBtn;
      reviewConfirmBtn.disabled = false;

      reviewCardBody.innerHTML = '';
      buildReviewRows_(formData).forEach(function (r) {
        const rowEl = document.createElement('div');
        rowEl.className = 'review-row';
        const lbl = document.createElement('div');
        lbl.className = 'rlabel';
        lbl.textContent = r.label;
        const val = document.createElement('div');
        val.className = 'rvalue';
        val.textContent = r.value;
        rowEl.appendChild(lbl);
        rowEl.appendChild(val);
        reviewCardBody.appendChild(rowEl);
      });

      // แถวรูปภาพ: แสดงเป็น thumbnail แทนข้อความ (ถ้ามีรูปแนบ)
      if (selectedImages.length > 0) {
        const imgRow = document.createElement('div');
        imgRow.className = 'review-row';
        const lbl = document.createElement('div');
        lbl.className = 'rlabel';
        lbl.textContent = t.image;
        const val = document.createElement('div');
        val.className = 'review-images';
        selectedImages.forEach(function (img) {
          const im = document.createElement('img');
          im.src = img.base64;
          im.alt = img.fileName || '';
          val.appendChild(im);
        });
        imgRow.appendChild(lbl);
        imgRow.appendChild(val);
        reviewCardBody.appendChild(imgRow);
      }

      reviewOverlay.classList.add('active');
    }

    reviewEditBtn.addEventListener('click', function () {
      reviewOverlay.classList.remove('active');
    });

    // คลิกพื้นหลังนอกการ์ด = ปิด modal กลับไปแก้ไข (เหมือนกด "แก้ไขข้อมูล")
    reviewOverlay.addEventListener('click', function (e) {
      if (e.target === reviewOverlay) reviewOverlay.classList.remove('active');
    });

    reviewConfirmBtn.addEventListener('click', function () {
      if (!pendingFormData) return;
      const t = I18N[currentLang];
      reviewOverlay.classList.remove('active');
      reviewConfirmBtn.disabled = true;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>' + t.submitting;
      finalizeSubmit(pendingFormData);
    });

    function resetFormUI() {
      pendingFormData = null;
      clearDraftStorage_();
      form.reset();
      document.querySelectorAll('#serviceTypeGroup .checkbox-item').forEach(function (item) {
        item.classList.remove('checked');
      });
      datePicker.clear();
      selectedImages = [];
      renderImagePreviews();
      resetLocationMap();
      refreshAvailableSlots();
      renderDynamicFields();
      document.getElementById('fulfillmentType').value = '';
      renderFulfillmentFields();
    }

    function finalizeSubmit(formData) {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'submitBooking', data: formData })
      })
        .then(function (res) { return res.json(); })
        .then(function (res) {
          const t = I18N[currentLang];
          submitBtn.disabled = false;
          submitBtn.textContent = t.submitBtn;
          if (res.success) {
            showAlert('success', res.message);
            resetFormUI();
          } else {
            showAlert('error', res.message);
            if (res.slotTaken) {
              refreshAvailableSlots();
            }
          }
        })
        .catch(function (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = I18N[currentLang].submitBtn;
          const prefix = currentLang === 'EN' ? 'An error occurred: ' : (currentLang === 'ZH' ? '发生错误：' : 'เกิดข้อผิดพลาด: ');
          showAlert('error', prefix + err.message);
        });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      alertBox.style.display = 'none';

      const formData = collectFormData();
      const t = I18N[currentLang];

      // ===== เช็คทีละฟิลด์ แล้วบอกชัดเจนว่าฟิลด์ไหนว่าง (ช่วยดีบักแทนข้อความรวมๆ) =====
      const missingLabels = [];
      const lblOf = {
        serviceTypes: document.getElementById('lblServiceType').textContent,
        contactName: document.getElementById('lblContactName').textContent,
        phone: document.getElementById('lblPhone').textContent,
        bookingDate: document.getElementById('lblDate').textContent,
        bookingTime: document.getElementById('lblTime').textContent,
        fulfillmentType: document.getElementById('lblFulfillment').textContent
      };
      if (formData.serviceTypes.length === 0) missingLabels.push(lblOf.serviceTypes);
      if (!formData.contactName) missingLabels.push(lblOf.contactName);
      if (!formData.phone) missingLabels.push(lblOf.phone);
      if (!formData.bookingDate) missingLabels.push(lblOf.bookingDate);
      if (!formData.bookingTime) missingLabels.push(lblOf.bookingTime);
      if (!formData.fulfillmentType) missingLabels.push(lblOf.fulfillmentType);

      if (missingLabels.length > 0) {
        // แสดงชื่อฟิลด์ที่ขาดจริงๆ ต่อท้ายข้อความเดิม เพื่อให้เห็นสาเหตุตรงจุด
        showAlert('error', t.requiredError + ' (' + missingLabels.join(', ') + ')');
        console.log('[BOOKING DEBUG] missing fields:', missingLabels, 'formData:', formData);
        return;
      }

      // ===== ผ่านการตรวจครบถ้วนแล้ว: เก็บข้อมูลไว้รอยืนยัน แล้วเปิดหน้าสรุปให้ตรวจทานก่อน =====
      // การส่งข้อมูลจริง (finalizeSubmit) จะเกิดขึ้นก็ต่อเมื่อลูกค้ากด "ยืนยันการจอง" อีกครั้งในหน้าสรุปเท่านั้น
      pendingFormData = formData;
      showReviewModal_(formData);
    });

    // ===== บันทึกร่างฟอร์มอัตโนมัติด้วย localStorage =====
    // กันลูกค้าต้องกรอกใหม่ทั้งหมดถ้าพลาดปิดแท็บหรือเน็ตหลุดกลางคัน
    // หมายเหตุ: ไม่บันทึกรูปภาพ (selectedImages) เพราะเป็น base64 ขนาดใหญ่ อาจทำให้ localStorage เต็มได้ง่าย
    const DRAFT_STORAGE_KEY = 'mk_booking_draft_v1';
    const DRAFT_MAX_AGE_MS = 3 * 24 * 60 * 60 * 1000; // ไม่เสนอกู้คืนร่างที่เก่าเกิน 3 วัน (วันที่นัดมักจะผ่านไปแล้ว)
    let draftSaveTimer = null;
    let isApplyingDraft = false;
    let cachedDraftData = null;
    const draftBannerEl = document.getElementById('draftBanner');
    const draftBannerSubEl = document.getElementById('draftBannerSub');

    function saveDraftNow_() {
      if (isApplyingDraft) return;
      try {
        const data = collectFormData();
        delete data.images; // ไม่เก็บรูปภาพลง localStorage
        data._savedAt = Date.now();
        localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        console.warn('[Draft] บันทึกร่างไม่สำเร็จ:', e);
      }
    }

    function scheduleDraftSave() {
      if (isApplyingDraft) return;
      clearTimeout(draftSaveTimer);
      draftSaveTimer = setTimeout(saveDraftNow_, 500);
    }

    function clearDraftStorage_() {
      try { localStorage.removeItem(DRAFT_STORAGE_KEY); } catch (e) { /* เพิกเฉยถ้าเบราว์เซอร์บล็อก localStorage */ }
      cachedDraftData = null;
      draftBannerEl.classList.remove('active');
    }

    function updateDraftBannerText_() {
      if (!cachedDraftData) return;
      const t = I18N[currentLang];
      const localeMap = { TH: 'th-TH', EN: 'en-US', ZH: 'zh-CN' };
      let savedAtStr = '';
      try {
        savedAtStr = new Date(cachedDraftData._savedAt).toLocaleString(localeMap[currentLang] || 'en-US');
      } catch (e) {
        savedAtStr = new Date(cachedDraftData._savedAt).toString();
      }
      document.getElementById('draftBannerTitle').textContent = t.draftBannerTitle;
      draftBannerSubEl.textContent = t.draftSavedAt(savedAtStr);
      document.getElementById('draftRestoreBtn').textContent = t.draftRestoreBtn;
      document.getElementById('draftDiscardBtn').textContent = t.draftDiscardBtn;
    }

    function showDraftBanner_(data) {
      cachedDraftData = data;
      updateDraftBannerText_();
      draftBannerEl.classList.add('active');
    }

    /**
     * เติมค่าฟอร์มทั้งหมดจากร่างที่บันทึกไว้ กลับเข้าไปใน field ที่ตรงกัน
     * รวมถึงติ๊ก checkbox ประเภทบริการ, เรนเดอร์ฟิลด์เพิ่มเติม, และคืนค่าวันที่/เวลานัดที่เคยเลือกไว้
     */
    function applyDraftData_(data) {
      isApplyingDraft = true;
      try {
        if (data.contactName) document.getElementById('contactName').value = data.contactName;
        if (data.shopAddress) document.getElementById('shopAddress').value = data.shopAddress;
        if (data.kitchenInfo) document.getElementById('kitchenInfo').value = data.kitchenInfo;
        if (data.phone) document.getElementById('phone').value = data.phone;
        if (data.customerEmail) document.getElementById('customerEmail').value = data.customerEmail;

        // ติ๊ก checkbox ประเภทบริการตามที่บันทึกไว้ แล้วเรนเดอร์ฟิลด์เพิ่มเติม/ตัวเลือกบริการที่ต้องการใหม่
        (data.serviceTypes || []).forEach(function (v) {
          const el = document.getElementById('svc_' + v);
          if (!el) return;
          el.checked = true;
          const item = el.closest('.checkbox-item');
          if (item) item.classList.add('checked');
        });
        renderDynamicFields();
        renderFulfillmentOptions(false);

        // เติมค่าฟิลด์เพิ่มเติมตามประเภทบริการที่เพิ่งเรนเดอร์ใหม่ (รองรับทั้ง select/textarea/text/date)
        (data.serviceTypes || []).forEach(function (svc) {
          (DYNAMIC_FIELDS[svc] || []).forEach(function (f) {
            const val = data[f.id];
            if (!val) return;
            const inputEl = document.getElementById(f.id);
            if (!inputEl) return;
            if (f.type === 'date' && inputEl._flatpickr) inputEl._flatpickr.setDate(val, true);
            else inputEl.value = val;
          });
        });

        // บริการที่ต้องการ (fulfillmentType) + ฟิลด์เพิ่มเติมของตัวเลือกนั้น
        if (data.fulfillmentType) {
          const sel = document.getElementById('fulfillmentType');
          sel.value = data.fulfillmentType;
          renderFulfillmentFields();
          (FULFILLMENT_FIELDS[data.fulfillmentType] || []).forEach(function (f) {
            const val = data[f.id];
            if (!val) return;
            const inputEl = document.getElementById(f.id);
            if (!inputEl) return;
            if (f.type === 'date' && inputEl._flatpickr) inputEl._flatpickr.setDate(val, true);
            else inputEl.value = val;
          });
        }

        // ตำแหน่งที่เคยปักหมุดไว้บนแผนที่
        if (data.mapLat && data.mapLng) {
          const lat = parseFloat(data.mapLat);
          const lng = parseFloat(data.mapLng);
          if (!isNaN(lat) && !isNaN(lng)) setPickedLocation(lat, lng, true);
        }

        // วันที่/เวลานัด: คืนค่าได้เฉพาะวันที่ยังไม่ผ่านไป (กันกรณีร่างเก่าเลือกวันที่ล่วงเลยมาแล้ว)
        if (data.bookingDate) {
          const picked = new Date(data.bookingDate + 'T00:00:00');
          const todayCheck = new Date();
          todayCheck.setHours(0, 0, 0, 0);
          if (picked >= todayCheck) {
            datePicker.setDate(data.bookingDate, false);
            refreshAvailableSlots(data.bookingTime || '');
          }
        }
      } finally {
        isApplyingDraft = false;
      }
    }

    function restoreDraftIfAny_() {
      let raw;
      try {
        raw = localStorage.getItem(DRAFT_STORAGE_KEY);
      } catch (e) {
        return; // localStorage ถูกบล็อก (เช่น โหมด private บางเบราว์เซอร์) - ข้ามฟีเจอร์นี้ไปเงียบๆ
      }
      if (!raw) return;
      let data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        clearDraftStorage_();
        return;
      }
      if (!data || !data._savedAt || (Date.now() - data._savedAt) > DRAFT_MAX_AGE_MS) {
        clearDraftStorage_();
        return;
      }
      // มีเนื้อหาให้กู้คืนจริงหรือเปล่า (กันกรณีร่างว่างเปล่าจากการเปิดหน้าเว็บทิ้งไว้เฉยๆ)
      const hasContent = data.contactName || data.phone || (data.serviceTypes && data.serviceTypes.length > 0) ||
        data.shopAddress || data.bookingDate;
      if (!hasContent) {
        clearDraftStorage_();
        return;
      }
      showDraftBanner_(data);
    }

    document.getElementById('draftRestoreBtn').addEventListener('click', function () {
      if (cachedDraftData) applyDraftData_(cachedDraftData);
      draftBannerEl.classList.remove('active');
    });
    document.getElementById('draftDiscardBtn').addEventListener('click', function () {
      clearDraftStorage_();
    });

    // บันทึกร่างทุกครั้งที่มีการพิมพ์/เลือกค่าในฟอร์ม (event delegation ที่ระดับฟอร์ม ครอบคลุมฟิลด์ที่เรนเดอร์ทีหลังด้วย)
    form.addEventListener('input', scheduleDraftSave);
    form.addEventListener('change', scheduleDraftSave);

    // เริ่มต้นหน้าเว็บด้วยภาษาไทย
    applyLanguage('TH');
    restoreDraftIfAny_();
  </script>

  <script type="text/javascript">
  var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();

  // ===== ซ่อน widget เริ่มต้นของ Tawk ทันทีที่โหลดเสร็จ / เปลี่ยนสถานะ เพื่อให้เหลือแค่ปุ่มลอยที่สร้างเอง (.chat-float-btn) =====
  Tawk_API.onLoad = function(){
    hideTawkWidget();
  };
  Tawk_API.onStatusChange = function(){
    hideTawkWidget();
  };

  function hideTawkWidget(){
    if (window.Tawk_API && Tawk_API.hideWidget) {
      Tawk_API.hideWidget();
    }
  }

  // ===== เผื่อ onLoad ทำงานช้ากว่าที่ widget เริ่มต้นจะโผล่ขึ้นมา: เช็คซ้ำทุก 300ms จนกว่าจะซ่อนสำเร็จ =====
  // (หยุดเช็คเองหลัง ~9 วินาที กันลูปค้างถ้า Tawk โหลดไม่สำเร็จ)
  var tawkHideAttempts = 0;
  var tawkHideInterval = setInterval(function () {
    tawkHideAttempts++;
    if (window.Tawk_API && Tawk_API.hideWidget) {
      Tawk_API.hideWidget();
      clearInterval(tawkHideInterval);
    }
    if (tawkHideAttempts > 30) clearInterval(tawkHideInterval);
  }, 300);

  s0.parentNode.insertBefore(s1,s0);
  })();
